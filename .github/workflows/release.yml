name: Release

# main 上 manifest.json 的版本號改變時，自動測試、打包，並建立該版本的 GitHub Release 供 BRAT 安裝
on:
  push:
    branches: [main]
    paths: [manifest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: 建立 Release（該版本已存在就略過）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./manifest.json').version")
          if gh release view "$v" >/dev/null 2>&1; then echo "Release $v 已存在，略過"; exit 0; fi
          gh release create "$v" main.js manifest.json styles.css --target "$GITHUB_SHA" --title "$v" --notes "見 README。"
